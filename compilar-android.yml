name: Compilar Control Académico RD Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Control_Academico_RD_Android.zip'
      - '.github/workflows/compilar-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        shell: bash
        run: |
          rm -rf proyecto_android
          mkdir -p proyecto_android
          unzip -q Control_Academico_RD_Android.zip -d proyecto_android
          PROJECT_DIR=$(dirname "$(find proyecto_android -name settings.gradle -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle dentro del ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK de prueba
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Compilar AAB release sin firma
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon bundleRelease

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Control-Academico-RD-APK-prueba
          path: proyecto_android/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar AAB sin firma
        uses: actions/upload-artifact@v4
        with:
          name: Control-Academico-RD-AAB-sin-firma
          path: proyecto_android/**/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
